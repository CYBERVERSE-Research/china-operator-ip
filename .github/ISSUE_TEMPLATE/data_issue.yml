name: 数据问题/纠错
description: 反馈 IP 归属、缺失或错误的条目
title: "[Data]: "
labels:
  - data
body:
  - type: markdown
    attributes:
      value: |
        请提供尽可能完整的信息，帮助核对 BGP/ASN 数据来源。
        本项目只收录中国电信、中国移动、中国联通三家。
  - type: input
    id: prefix
    attributes:
      label: 相关 IP 段
      description: CIDR 格式（可多个）
      placeholder: "1.2.3.0/24, 2408:xxxx::/32"
    validations:
      required: true
  - type: dropdown
    id: operator
    attributes:
      label: 运营商分类
      multiple: false
      options:
        - 中国电信（chinanet）
        - 中国移动（cmcc）
        - 中国联通（unicom）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 信息来源
      description: WHOIS/BGP/ASN 线索、对比来源、截图等
      placeholder: "如: APNIC WHOIS, bgp.he.net, 路由公告截图"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 补充信息
      description: 其他需要补充的信息（可选）
    validations:
      required: false
