name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# runner 固定为 ubuntu-26.04：test job 直接用镜像预装的 ruby；缓存键带上 ImageOS。见 ADR-0005。

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: sanitize
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Desensitization review
        run: ./scripts/sanitize.sh

  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Identify runner image
        id: image
        run: |
          echo "os=${ImageOS:?not set; this job expects a GitHub-hosted runner}" >> "$GITHUB_OUTPUT"
          echo "${ImageOS} ${ImageVersion:-}"; ruby --version; cargo --version
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ steps.image.outputs.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.image.outputs.os }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: ./scripts/check-ruby-recipes.py
      - run: ruby tests/operators_test.rb
