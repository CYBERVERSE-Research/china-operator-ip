name: Release

# 每三天发布一次 IP 列表。生成结果只作为 release 资产，不写回任何分支。
# cron 的 */3 按"日"推进，因此月末到下月 1 日的间隔可能是 1~3 天。
on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只生成并校验，不创建 release
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 固定镜像：配方依赖镜像预装的 ruby；缓存键带上 ImageOS，不恢复别的镜像上装的二进制。见 ADR-0005。
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cargo-bins/cargo-binstall@v1.25.2
        with:
          version: 1.25.2
      - uses: extractions/setup-just@v4
      - name: Identify runner image
        id: image
        run: |
          echo "os=${ImageOS:?not set; this job expects a GitHub-hosted runner}" >> "$GITHUB_OUTPUT"
          echo "${ImageOS} ${ImageVersion:-}"; ruby --version; cargo --version
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ steps.image.outputs.os }}-cargo-bin-${{ hashFiles('justfile') }}
          restore-keys: ${{ runner.os }}-${{ steps.image.outputs.os }}-cargo-bin-
          path: ~/.cargo/bin
      - name: Ensure aria2 is available
        run: command -v aria2c || sudo apt-get install -y --no-install-recommends aria2

      - run: just dependency
      - name: Generate IP lists
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: just
      - name: Package release assets
        run: just package

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y.%m.%d)"
          tag="v${date}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            tag="v${date}-$(date -u +%H%M)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          set -euo pipefail
          {
            echo "按中国电信、中国移动、中国联通分类的 IP 列表，由 BGP RIB 快照生成。"
            echo "\`cn\` 是 APNIC delegated 统计中的全部中国（CN）地址，含教育网等，重叠与相邻的段已合并。"
            echo "三家运营商列表互不重叠：同时归属多家的段只归入一家，优先级为电信 > 联通 > 移动。"
            echo
            echo "| 列表 | IPv4 | IPv6 | IPv4+IPv6 |"
            echo "|---|---|---|---|"
            while read -r name v4 v6 both; do
              printf '| %s | %s | %s | %s |\n' "$name" \
                "$(wc -l < "dist/${v4}")" \
                "$(wc -l < "dist/${v6}")" \
                "$(wc -l < "dist/${both}")"
            done < <(just published_lists)
            echo
            echo "表格中的数字是 CIDR 条目数。资产校验值见 \`SHA256SUMS\`。"
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        # 显式判定事件类型：schedule 触发时 inputs 为空，不能依赖 !inputs.dry_run
        # 的隐式取值——一旦它被当成 false，定时发布会被静默跳过。
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.tag.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "IP lists ${{ steps.tag.outputs.tag }}" \
            --notes-file release-notes.md \
            --latest \
            dist/*
