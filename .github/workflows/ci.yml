name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# runner 固定为 ubuntu-24.04：test job 直接用镜像预装的 ruby。见 ADR-0004。

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: sanitize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Desensitization review
        run: ./scripts/sanitize.sh

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: ./scripts/check-ruby-recipes.py
      - run: ruby tests/operators_test.rb
